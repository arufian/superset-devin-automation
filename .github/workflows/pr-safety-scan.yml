name: Devin Automation - PR Safety Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to scan
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  pr-safety-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/superset-devin-automation
          ref: main
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd automation
          pip install -e .

      - name: Scan pull request diff
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPO: ${{ vars.TARGET_REPO || github.repository }}
          SIMULATION_MODE: ${{ vars.SIMULATION_MODE || 'false' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          DB_PATH: data/jobs.db
        run: |
          cd automation
          python -m src.actions pr-safety

      - name: Upload safety database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-jobs-database
          path: automation/data/jobs.db
          retention-days: 30
