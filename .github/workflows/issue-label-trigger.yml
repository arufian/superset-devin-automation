name: Devin Automation - Issue Governance

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
      action:
        description: Governance action
        required: true
        default: fix
        type: choice
        options:
          - classify
          - fix
          - plan
          - implement_plan

permissions:
  contents: read
  issues: write

jobs:
  classify-or-dispatch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.comment.body == 'run that plan')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/superset-devin-automation
          ref: main
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd automation
          pip install -e .

      - name: Process issue
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ vars.TARGET_REPO || github.repository }}
          SIMULATION_MODE: ${{ vars.SIMULATION_MODE || 'false' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          DB_PATH: data/jobs.db
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED || 'false' }}
          STALE_JOB_HOURS: ${{ vars.STALE_JOB_HOURS || '24' }}
          AUTOMATION_COMMENTS_ENABLED: 'false'
        run: |
          cd automation
          python -m src.actions issue-governance

      - name: Upload job database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-database
          path: automation/data/jobs.db
          retention-days: 30
