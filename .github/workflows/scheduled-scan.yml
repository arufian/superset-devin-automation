name: Devin Automation - Scheduled Scan

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  scan-ready-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/superset-devin-automation
          ref: main
          path: automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd automation
          pip install -e .

      - name: Recover scheduled automation work
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ vars.TARGET_REPO || 'arufian/superset' }}
          SIMULATION_MODE: ${{ vars.SIMULATION_MODE || 'false' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          DB_PATH: data/jobs.db
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED || 'false' }}
          STALE_JOB_HOURS: ${{ vars.STALE_JOB_HOURS || '24' }}
          AUTOMATION_COMMENTS_ENABLED: 'false'
        run: |
          cd automation
          python -m src.actions scheduled-recovery

      - name: Upload job database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-database-scan
          path: automation/data/jobs.db
          retention-days: 30
